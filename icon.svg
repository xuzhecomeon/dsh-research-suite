<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="t d">
  <title id="t">dsh-research-suite</title>
  <desc id="d">三股支流汇成一条上升主线，外围同心等高线代表可检索的知识底座。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2f3a"/>
      <stop offset="1" stop-color="#0d5c4d"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#4fd1b0"/>
      <stop offset="1" stop-color="#eafff7"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- 同心等高线：知识底座 -->
  <g fill="none" stroke="#8ff0d4" stroke-width="4">
    <circle cx="256" cy="268" r="152" opacity=".14"/>
    <circle cx="256" cy="268" r="114" opacity=".20"/>
    <circle cx="256" cy="268" r="78" opacity=".28"/>
  </g>

  <!-- 三股汇流 -->
  <g fill="none" stroke="#6fe0c2" stroke-width="17" stroke-linecap="round" opacity=".92">
    <path d="M104 404 C 150 352, 190 336, 256 320"/>
    <path d="M408 404 C 362 352, 322 336, 256 320"/>
    <path d="M256 444 C 248 400, 252 356, 256 320"/>
  </g>

  <!-- 汇合点后的一条主线 -->
  <path d="M256 320 L 256 178" fill="none" stroke="url(#core)" stroke-width="22" stroke-linecap="round"/>

  <!-- 顶端数据点 + 外环 -->
  <circle cx="256" cy="160" r="34" fill="none" stroke="#eafff7" stroke-width="7" opacity=".55"/>
  <circle cx="256" cy="160" r="17" fill="#eafff7"/>

  <!-- 支流起点数据点 -->
  <g fill="#4fd1b0">
    <circle cx="104" cy="404" r="13"/>
    <circle cx="408" cy="404" r="13"/>
    <circle cx="256" cy="444" r="13"/>
  </g>
</svg>
