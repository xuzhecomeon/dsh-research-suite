name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 静态校验与打包检查
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 包体校验（package.json / patch / 技能 frontmatter / catalog 对账 / 版本一致性）
        run: node scripts/verify-package.mjs

      - name: 能力卡校验（docs/CAPABILITY-SPEC.md §3.1 + §3.2）
        run: node scripts/verify-capabilities.mjs all

      - name: 判定账本校验（450 条源技能逐条判定 / fused 可核 / 11 域覆盖）
        run: node scripts/verify-ledger.mjs all

      - name: 自测（假 ctx 调 apply：入口契约 / 技能内联 content / 12 工具 / 策略段 / 数据面）
        run: |
          if [ -f scripts/selftest.mjs ]; then
            node scripts/selftest.mjs
          else
            echo "scripts/selftest.mjs 不存在，跳过自测"
          fi

      - name: 执行与核验层自测（lib/verify.js：数据/交付物/DOI/引用对账，39 项，不联网）
        run: node scripts/test-verify.mjs

      - name: 任务识别 golden set（50 条真人原话，strict 门槛：cap1≥0.65 / cap3≥0.85 / domain≥0.8 / decision≥0.9）
        run: node scripts/eval-match.mjs --strict

      - name: npm pack --dry-run（打包清单，不上传）
        run: npm pack --dry-run

  publish:
    name: 发布到 npm（带 provenance）
    # 当前只允许手动触发（workflow_dispatch）：仓库还没配 secret NPM_TOKEN 时，
    # 打 tag 自动发布会以 401 失败，把整个 Actions 页刷红。
    # 等 npm 账号与 NPM_TOKEN 配好后，把下面这行换成：
    #   if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm --provenance 需要 OIDC
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: 校验 tag 与 package.json 版本一致
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG 与 package.json $PKG 不一致，拒绝发布"
            exit 1
          fi

      - name: npm publish --provenance
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
