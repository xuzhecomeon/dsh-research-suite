<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>medical-illustration 学科示例图库（26 张）</title>
<style>
  body { font-family: "Microsoft YaHei", sans-serif; margin: 0; background: #f6f8fa; color: #1f2937; }
  header { background: #ffffff; border-bottom: 1px solid #e5e7eb; padding: 24px 32px; }
  header h1 { margin: 0 0 6px; font-size: 22px; }
  header p { margin: 0; color: #6b7280; font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 20px; padding: 24px 32px; }
  .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; overflow: hidden; }
  .card img { width: 100%; display: block; border-bottom: 1px solid #f0f0f0; }
  .card .info { padding: 10px 14px 12px; }
  .card .tag { display: inline-block; font-size: 12px; color: #3b7dbf; background: #eef5fc; border-radius: 4px; padding: 2px 8px; margin-bottom: 6px; }
  .card .name { font-size: 13px; color: #6b7280; font-family: Consolas, monospace; }
  .card h3 { margin: 4px 0 2px; font-size: 15px; }
  footer { padding: 12px 32px 28px; color: #9ca3af; font-size: 12.5px; }
</style>
</head>
<body>
<header>
  <h1>医学专业绘图 · 学科示例图库</h1>
  <p>26 张学科标杆示例 · 每张含 .py 脚本（可改写复用）+ .svg 矢量源 + .png 300DPI · 位置：assets/examples/disciplines/</p>
</header>
<div class="grid" id="grid"></div>
<footer>所有图形为代码原创、版权归使用者；图中数据为示意值，发表前请替换为真实数据。SimHei 不含 ⁺ / ²，请写 CD4+、I2。</footer>
<script>
const figs = [
  ["分子生物 / 基础医学","central_dogma","中心法则：遗传信息流动"],
  ["病毒 / 微生物","virus_replication_cycle","有包膜病毒侵染与复制周期"],
  ["Meta 分析","meta_forest_plot","森林图（OR、95%CI、合并菱形）"],
  ["单细胞测序","scrna_workflow","scRNA-seq 工作流与 UMAP 聚类"],
  ["空间转录组","spatial_transcriptomics","空间表达图谱与生态位"],
  ["WGCNA","wgcna_modules","模块识别与模块-性状关联热图"],
  ["孟德尔随机化","mendelian_randomization","三大核心假设与分析方法"],
  ["中医妇科","tcm_gynecology_axis","肾-天癸-冲任-胞宫轴"],
  ["西医妇产","menstrual_cycle","月经周期三联图"],
  ["子痫前期单细胞","preeclampsia_scrna","胎盘绒毛 + scRNA 研究设计"],
  ["内科","t2d_mechanism","2 型糖尿病机制与靶器官损害"],
  ["超声医学","ultrasound_principle","成像原理 + B 超/多普勒"],
  ["口腔医学","tooth_structure_caries","牙体结构与龋病进展"],
  ["基础医学（炎症）","acute_inflammation","急性炎症与白细胞渗出"],
  ["分子机制 · 小鼠","mouse_experiment_design","小鼠模型实验设计全流程"],
  ["临床检验诊断","elisa_sandwich","ELISA 双抗体夹心法"],
  ["核医学","pet_ct_principle","PET/CT 显像原理（18F-FDG）"],
  ["头颈肿瘤 / 免疫治疗","immune_checkpoint","PD-1/PD-L1 检查点机制"],
  ["肿瘤学","cancer_metastasis_emt","EMT 与血行转移"],
  ["肺癌 / 呼吸","lung_cancer_pathogenesis","气道上皮癌变四阶段"],
  ["药物制剂","liposome_nanomedicine","脂质体纳米给药与 EPR"],
  ["生物医药","adc_biopharma","ADC 结构与作用机制"],
  ["血液肿瘤","car_t_therapy","CAR-T 从采集到杀伤"],
  ["脑神经 / 蛋白（AD）","alzheimers_mechanism","Aβ 级联与 Tau 磷酸化"],
  ["植物化妆品 · 天麻","gastrodin_cosmetics","天麻素护肤功效机制"],
  ["骨科","fracture_healing","骨折愈合四期与骨重建"]
];
document.getElementById("grid").innerHTML = figs.map(([tag, f, t]) => `
  <div class="card">
    <img loading="lazy" src="${f}.png" alt="${t}">
    <div class="info">
      <span class="tag">${tag}</span>
      <h3>${t}</h3>
      <div class="name">${f}.py / .svg / .png</div>
    </div>
  </div>`).join("");
</script>
</body>
</html>
