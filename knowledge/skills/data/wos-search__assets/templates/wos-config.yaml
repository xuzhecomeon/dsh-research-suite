# ============================================================
# Web of Science 高级检索配置文件
# 本文件是检索的【唯一事实来源】——所有关键词、字段、过滤条件
# 一律以本文件为准,严禁在执行时自创、篡改或删减。
# ============================================================
# 使用方式:复制本文件到你的工作目录,修改 query/filters 后
# 先用 YAML 解析器验证语法(顶层键必须顶格),再交给 agent 执行。

# 目标数据库:WOSC = Web of Science Core Collection
database: WOSC

# ------------------------------------------------------------
# 检索条件(query):每条含 field(官方字段代码) + term(检索词)
# 多个条件之间用 logic 指定的连接词(AND / OR / NOT)连接
# 注意:term 内容原样使用,不加通配符、不改写。
# 注意:WoS 高级检索没有 ALL 字段,全字段检索请用 TS(主题)。
# 以下仅为示例,请替换为你的实际检索主题。
# ------------------------------------------------------------
query:
  - field: TS            # 主题(标题+摘要+关键词),字段代码必须为 WoS 官方字段
    term: 'artificial intelligence'
  - field: TS
    term: 'sports performance'
logic: AND             # query 各条之间的连接词:AND / OR / NOT

# ------------------------------------------------------------
# 过滤条件(filters):全部必须应用,一个不落,不得删除或弱化。
# 格式:field + value。区间写法:PY 用 2000-2026 表示 2000 至 2026。
# 多值写法:DT 用 "Article OR Review",生成检索式时原样包成
# DT=(Article OR Review),不拆解、不改写。
# ------------------------------------------------------------
filters:
  - field: PY            # 出版年
    value: 2000-2026
  - field: DT            # 文献类型
    value: "Article OR Review"

# ------------------------------------------------------------
# 排序(可选):PY:D 按出版年降序;TC:D 按被引次数降序;RS 按相关性
# ------------------------------------------------------------
sort: "PY:D"

# ------------------------------------------------------------
# 导出设置(可选):格式与保存目录、提取字段
# 检索用字段代码见 SKILL.md;导出标签:UT 入藏号, DI DOI, TI 标题,
# AU 作者, SO 期刊, PY 出版年, DT 文献类型, LA 语言, AB 摘要,
# DE 作者关键词(导出标签,检索时对应 AK)
# 注意:最终输出的 CSV/JSON 会自动追加一列 DOI_Status
# (valid/invalid/empty/error,经 CrossRef 验证),
# 交付的 DOI 均为验证有效后的结果。
# ------------------------------------------------------------
export:
  format: [csv, json]
  dir: ./wos-output
  fields: [UT, DI, TI, AU, SO, PY, DT, LA, AB, DE]

# ------------------------------------------------------------
# 预期命中数(可选):用于核对,页面命中数与预期差异 >20% 时日志中提醒
# ------------------------------------------------------------
# expected_hits: 500
